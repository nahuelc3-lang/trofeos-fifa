<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo The World's Game 2026 | FC 26</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }
body {
    margin:0;
    font-family:'Montserrat',sans-serif;
    background-image:url('fondo.png'); /* Usa tu fondo */
    background-color: #050505;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

h1 { text-align:center; font-size:36px; font-weight:900; letter-spacing:2px; color: #d4af37; padding-top: 20px;}

.container { max-width: 1400px; margin: auto; padding: 20px; }
.volver { display: block; text-align: center; margin-bottom: 20px; color: #00e5ff; text-decoration: none; font-weight: bold; }

/* PANEL SUPERIOR (EL ESCENARIO DEL SORTEO) */
.escenario {
    background: linear-gradient(135deg, #180914 0%, #3a1024 100%);
    border: 2px solid #d4af37;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    text-align: center;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* INPUTS JUGADORES */
.jugadores-setup {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 25px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
}
.jugador-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.color-box { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.5); }
.jugador-input-row input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #d4af37;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
}

.reveal-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    min-height: 120px;
    margin-bottom: 20px;
}

.team-reveal, .player-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.5s ease-in-out;
}

.team-reveal img { width: 80px; box-shadow: 0 0 15px rgba(0,0,0,0.8); border-radius: 4px; margin-bottom: 10px; }
.team-reveal span { font-size: 28px; font-weight: 900; letter-spacing: 1px; text-align: center;}
.team-reveal .grupo-info { font-size: 16px; color: #d4af37; text-transform: uppercase; margin-top: 5px; }

.player-reveal span { font-size: 40px; font-weight: 900; text-shadow: 0 0 15px rgba(255,255,255,0.3); text-transform: uppercase;}

@keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

.btn-accion {
    background: linear-gradient(135deg, #d4af37 0%, #aa8422 100%);
    color: #000;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    font-size: 20px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    transition: transform 0.2s;
    width: 350px;
    max-width: 100%;
}
.btn-accion:hover { transform: scale(1.05); }

/* DISEÑO DIVIDIDO: IZQUIERDA (EQUIPOS) Y DERECHA (GRUPOS) */
.layout-dividido {
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

/* IZQUIERDA: LISTA DE GRUPOS FIJOS */
.panel-izquierdo {
    flex: 1;
    min-width: 250px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 15px;
    padding: 15px;
    max-height: 800px;
    overflow-y: auto;
}

.bombo-mini { margin-bottom: 20px; }
.bombo-mini h4 { margin: 0 0 10px 0; color: #d4af37; text-align: center; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
.lista-paises { list-style: none; padding: 0; margin: 0; }
.lista-paises li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s; }
.lista-paises li img { width: 18px; }
.sorteado { opacity: 0.2; text-decoration: line-through; filter: grayscale(100%); }

/* DERECHA: GRUPOS ASIGNADOS */
.panel-derecho {
    flex: 3;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.grupo-box {
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #d4af37;
    border-radius: 10px;
    overflow: hidden;
}
.grupo-header {
    background: #240a16;
    padding: 10px;
    text-align: center;
    font-weight: 900;
    color: #fff;
    border-bottom: 2px solid #d4af37;
}
.grupo-tabla { width: 100%; border-collapse: collapse; }
.grupo-tabla td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: bold; font-size: 14px; min-height: 40px; }
.team-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team-row .team-info { display: flex; align-items: center; gap: 8px; }
.team-row img { width: 20px; border-radius: 2px; }

/* Tag del jugador asignado */
.player-tag {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 4px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 900;
}

/* Responsive */
@media (max-width: 900px) {
    .layout-dividido { flex-direction: column; }
    .panel-izquierdo { max-height: 300px; }
    .reveal-area { flex-direction: column; gap: 15px; text-align: center; }
}
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="volver">⬅ Volver al Menú Principal</a>
    <h1>🌎 The World's Game 2026</h1>

    <div class="escenario" id="escenario">
        
        <div id="pantalla-inicio" style="width: 100%;">
            <p style="opacity: 0.8; margin: 0 auto 20px auto; max-width: 600px;">
                Ingresa los nombres de los participantes. Se asignará una cantidad equitativa de selecciones a cada uno y se garantizará un reparto parejo en cada grupo.
            </p>
            
            <div class="jugadores-setup">
                <div class="jugador-input-row">
                    <div class="color-box" style="background: #e63946;"></div>
                    <input type="text" id="j1" value="Joaquín" placeholder="Jugador 1">
                </div>
                <div class="jugador-input-row">
                    <div class="color-box" style="background: #4cc9f0;"></div>
                    <input type="text" id="j2" value="Mateo" placeholder="Jugador 2">
                </div>
                <div class="jugador-input-row">
                    <div class="color-box" style="background: #06d6a0;"></div>
                    <input type="text" id="j3" value="Nico" placeholder="Jugador 3">
                </div>
                <div class="jugador-input-row">
                    <div class="color-box" style="background: #f77f00;"></div>
                    <input type="text" id="j4" value="Nahuel" placeholder="Jugador 4">
                </div>
            </div>

            <button class="btn-accion" onclick="comenzarEvento()">Iniciar Sorteo</button>
        </div>

        <div id="pantalla-sorteo" style="display: none; width: 100%;">
            <div class="reveal-area">
                <div class="team-reveal" id="team-reveal" style="display:none;">
                    <img id="reveal-flag" src="">
                    <span id="reveal-name">País</span>
                    <div class="grupo-info" id="reveal-grupo-info">GRUPO X</div>
                </div>
                <div class="player-reveal" id="player-reveal" style="display:none;">
                    <span style="font-size: 16px; font-weight: normal; margin-bottom: 5px; color: #aaa;">Mánager Asignado:</span>
                    <span id="reveal-player">Jugador</span>
                </div>
            </div>
            <button class="btn-accion" id="btn-paso" onclick="avanzarPaso()">Sacar Selección</button>
        </div>
    </div>

    <div class="layout-dividido" id="layout-abajo" style="display: none;">
        
        <div class="panel-izquierdo" id="contenedor-bombos">
            </div>

        <div class="panel-derecho" id="contenedor-grupos">
            </div>

    </div>
</div>

<script>
// LOS 12 GRUPOS OFICIALES DE THE WORLD'S GAME 2026 (EA FC)
const officialGroups = [
    { id: 'A', teams: [ {name: 'México', flag: 'mx'}, {name: 'Corea del Sur', flag: 'kr'}, {name: 'Sudáfrica', flag: 'za'}, {name: 'República Checa', flag: 'cz'} ] },
    { id: 'B', teams: [ {name: 'Canadá', flag: 'ca'}, {name: 'Suiza', flag: 'ch'}, {name: 'Qatar', flag: 'qa'}, {name: 'Bosnia y Herzegovina', flag: 'ba'} ] },
    { id: 'C', teams: [ {name: 'Brasil', flag: 'br'}, {name: 'Marruecos', flag: 'ma'}, {name: 'Escocia', flag: 'gb-sct'}, {name: 'Haití', flag: 'ht'} ] },
    { id: 'D', teams: [ {name: 'Estados Unidos', flag: 'us'}, {name: 'Australia', flag: 'au'}, {name: 'Paraguay', flag: 'py'}, {name: 'Turquía', flag: 'tr'} ] },
    { id: 'E', teams: [ {name: 'Alemania', flag: 'de'}, {name: 'Ecuador', flag: 'ec'}, {name: 'Costa de Marfil', flag: 'ci'}, {name: 'Curazao', flag: 'cw'} ] },
    { id: 'F', teams: [ {name: 'Países Bajos', flag: 'nl'}, {name: 'Japón', flag: 'jp'}, {name: 'Suecia', flag: 'se'}, {name: 'Túnez', flag: 'tn'} ] },
    { id: 'G', teams: [ {name: 'Bélgica', flag: 'be'}, {name: 'Irán', flag: 'ir'}, {name: 'Egipto', flag: 'eg'}, {name: 'Nueva Zelanda', flag: 'nz'} ] },
    { id: 'H', teams: [ {name: 'España', flag: 'es'}, {name: 'Uruguay', flag: 'uy'}, {name: 'Arabia Saudita', flag: 'sa'}, {name: 'Cabo Verde', flag: 'cv'} ] },
    { id: 'I', teams: [ {name: 'Francia', flag: 'fr'}, {name: 'Irak', flag: 'iq'}, {name: 'Noruega', flag: 'no'}, {name: 'Senegal', flag: 'sn'} ] },
    { id: 'J', teams: [ {name: 'Argentina', flag: 'ar'}, {name: 'Argelia', flag: 'dz'}, {name: 'Austria', flag: 'at'}, {name: 'Jordania', flag: 'jo'} ] },
    { id: 'K', teams: [ {name: 'Portugal', flag: 'pt'}, {name: 'Colombia', flag: 'co'}, {name: 'Uzbekistán', flag: 'uz'}, {name: 'Rep. Dem. Congo', flag: 'cd'} ] },
    { id: 'L', teams: [ {name: 'Inglaterra', flag: 'gb-eng'}, {name: 'Croacia', flag: 'hr'}, {name: 'Ghana', flag: 'gh'}, {name: 'Panamá', flag: 'pa'} ] }
];

// VARIABLES DE ESTADO
let jugadoresActivos = [];
let secuenciaSorteo = []; // El orden en el que salen las 48 selecciones
let pasoActual = 0;
let estadoFase = 'ESPERANDO'; // ESPERANDO, EQUIPO_REVELADO, JUGADOR_REVELADO

const coloresJugadores = ['#e63946', '#4cc9f0', '#06d6a0', '#f77f00']; // Rojo, Azul, Verde, Naranja

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

// RENDERIZA LAS VISTAS ANTES Y DESPUES DE INICIAR
function renderEstructuraUI() {
    // 1. Panel Izquierdo (Equipos pendientes)
    let htmlIzq = '';
    officialGroups.forEach(g => {
        htmlIzq += `<div class="bombo-mini"><h4>GRUPO ${g.id}</h4><ul class="lista-paises">`;
        g.teams.forEach(t => {
            let safeId = t.name.replace(/\s+/g, '-');
            htmlIzq += `<li id="left-${safeId}"><img src="https://flagcdn.com/w40/${t.flag}.png">${t.name}</li>`;
        });
        htmlIzq += `</ul></div>`;
    });
    document.getElementById("contenedor-bombos").innerHTML = htmlIzq;

    // 2. Panel Derecho (Cajas de los Grupos listas para rellenar)
    let htmlDer = '';
    officialGroups.forEach(g => {
        htmlDer += `
        <div class="grupo-box">
            <div class="grupo-header">GRUPO ${g.id}</div>
            <table class="grupo-tabla" id="table-group-${g.id}">
                </table>
        </div>`;
    });
    document.getElementById("contenedor-grupos").innerHTML = htmlDer;
}

// LOGICA DE REPARTO PERFECTO
function generarSecuenciaSorteo() {
    let preAsignaciones = []; // 48 items que unen Seleccion + Jugador
    let numPlayers = jugadoresActivos.length;

    officialGroups.forEach(grupo => {
        // En cada grupo repartimos los jugadores para que sea lo más parejo posible
        let poolGrupo = [];
        
        if(numPlayers === 4) {
            // Reparto exacto: 1 equipo por jugador en CADA grupo
            poolGrupo = shuffle([...jugadoresActivos]);
        } 
        else if (numPlayers === 2) {
            // Reparto exacto: 2 equipos por jugador en CADA grupo
            poolGrupo = shuffle([jugadoresActivos[0], jugadoresActivos[0], jugadoresActivos[1], jugadoresActivos[1]]);
        }
        else if (numPlayers === 3) {
            // Es el caso irregular. Agarramos un pool aleatorio para este grupo del sobrante, 
            // asegurando que en el total de 48, queden exactamente 16 c/u.
            // Para simplificar: tomaremos del pool global y validaremos max 2 por grupo.
        }

        // Caso General & 3 jugadores (algoritmo global validado)
        if (numPlayers === 3 && preAsignaciones.length === 0) {
            // Pre-armar array de 48: 16 de J1, 16 de J2, 16 de J3
            let poolGlobal = [];
            for(let i=0; i<16; i++) { poolGlobal.push(jugadoresActivos[0], jugadoresActivos[1], jugadoresActivos[2]); }
            
            let esValido = false;
            while(!esValido) {
                poolGlobal = shuffle(poolGlobal);
                esValido = true;
                // Revisar que en bloques de 4 (grupos) no se repita un jugador 3 veces
                for(let g=0; g<12; g++) {
                    let c = {};
                    for(let t=0; t<4; t++) {
                        let p = poolGlobal[g*4 + t].name;
                        c[p] = (c[p] || 0) + 1;
                        if(c[p] > 2) esValido = false;
                    }
                    if(!esValido) break;
                }
            }
            
            // Asignarlo a preAsignaciones (aplanado)
            let i = 0;
            officialGroups.forEach(gr => {
                gr.teams.forEach(tm => {
                    preAsignaciones.push({ group: gr.id, team: tm, player: poolGlobal[i] });
                    i++;
                });
            });
            return shuffle(preAsignaciones); // Cortamos la función devolviendo la secuencia mezclada
        }

        // Para 2 y 4 jugadores armamos el push normal por grupo
        if (numPlayers !== 3) {
            grupo.teams.forEach((team, index) => {
                preAsignaciones.push({
                    group: grupo.id,
                    team: team,
                    player: poolGrupo[index]
                });
            });
        }
    });

    // Desordenamos TODO el array de 48 para que las selecciones salgan en cualquier orden
    return shuffle(preAsignaciones);
}

function comenzarEvento() {
    // 1. Obtener y validar jugadores
    jugadoresActivos = [];
    for(let i=1; i<=4; i++) {
        let val = document.getElementById(`j${i}`).value.trim();
        if(val) jugadoresActivos.push({ name: val, color: coloresJugadores[i-1] });
    }

    if(jugadoresActivos.length < 2) {
        alert("¡Debes ingresar al menos 2 jugadores para el sorteo!");
        return;
    }

    // 2. Armar la data e interfaz
    renderEstructuraUI();
    secuenciaSorteo = generarSecuenciaSorteo();
    
    // 3. Cambiar pantalla
    document.getElementById('pantalla-inicio').style.display = 'none';
    document.getElementById('pantalla-sorteo').style.display = 'block';
    document.getElementById('layout-abajo').style.display = 'flex';
}

// MÁQUINA DE ESTADOS VISUAL DEL BOTON DE SORTEO
function avanzarPaso() {
    if (pasoActual >= secuenciaSorteo.length) return;

    let dataActual = secuenciaSorteo[pasoActual];
    let btn = document.getElementById('btn-paso');

    if (estadoFase === 'ESPERANDO') {
        // Fase 1: Revela a quién le tocó (Nación)
        document.getElementById('team-reveal').style.display = 'flex';
        document.getElementById('player-reveal').style.display = 'none';
        
        document.getElementById('reveal-flag').src = `https://flagcdn.com/w80/${dataActual.team.flag}.png`;
        document.getElementById('reveal-name').innerText = dataActual.team.name;
        document.getElementById('reveal-grupo-info').innerText = `PERTENECE AL GRUPO ${dataActual.group}`;
        
        btn.innerText = '¿A quién le toca?';
        estadoFase = 'EQUIPO_REVELADO';

    } else if (estadoFase === 'EQUIPO_REVELADO') {
        // Fase 2: Revela qué Jugador la recibe
        document.getElementById('player-reveal').style.display = 'flex';
        
        let pName = document.getElementById('reveal-player');
        pName.innerText = dataActual.player.name;
        pName.style.color = dataActual.player.color;
        
        btn.innerText = 'Siguiente Equipo';
        estadoFase = 'JUGADOR_REVELADO';

    } else if (estadoF
