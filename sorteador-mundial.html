<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo The World's Game 2026 | FC 26</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }
body {
    margin:0;
    font-family:'Montserrat',sans-serif;
    background-image:url('fondo.png'); /* Usa tu fondo */
    background-color: #050505;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

h1 { text-align:center; font-size:36px; font-weight:900; letter-spacing:2px; color: #d4af37; padding-top: 20px;}

.container { max-width: 1400px; margin: auto; padding: 20px; }
.volver { display: block; text-align: center; margin-bottom: 20px; color: #00e5ff; text-decoration: none; font-weight: bold; }

/* PANEL SUPERIOR (EL ESCENARIO DEL SORTEO) */
.escenario {
    background: linear-gradient(135deg, #180914 0%, #3a1024 100%);
    border: 2px solid #d4af37;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    text-align: center;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* INPUTS JUGADORES */
.jugadores-setup {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
    max-width: 400px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
}
.jugador-row {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(0,0,0,0.5);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s;
}
.jugador-row:hover { background: rgba(212, 175, 55, 0.1); border-color: #d4af37; }
.j-check { width: 22px; height: 22px; cursor: pointer; accent-color: #d4af37; }
.color-box { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.5); }
.jugador-row span { font-size: 18px; font-weight: bold; flex: 1; text-align: left; }

.reveal-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    min-height: 120px;
    margin-bottom: 20px;
}

.team-reveal, .player-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.5s ease-in-out;
}

.team-reveal img { width: 80px; box-shadow: 0 0 15px rgba(0,0,0,0.8); border-radius: 4px; margin-bottom: 10px; }
.team-reveal span { font-size: 28px; font-weight: 900; letter-spacing: 1px; text-align: center;}
.team-reveal .grupo-info { font-size: 16px; color: #d4af37; text-transform: uppercase; margin-top: 5px; }

.player-reveal span { font-size: 40px; font-weight: 900; text-shadow: 0 0 15px rgba(255,255,255,0.3); text-transform: uppercase;}

@keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

.btn-accion {
    background: linear-gradient(135deg, #d4af37 0%, #aa8422 100%);
    color: #000;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    font-size: 20px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    transition: transform 0.2s;
    width: 350px;
    max-width: 100%;
}
.btn-accion:hover { transform: scale(1.05); }

/* DISEÑO DIVIDIDO: IZQUIERDA (EQUIPOS) Y DERECHA (GRUPOS) */
.layout-dividido {
    display: flex;
    gap: 30px;
    align-items: flex-start;
}

/* IZQUIERDA: LISTA DE BOMBOS */
.panel-izquierdo {
    flex: 1;
    min-width: 250px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 15px;
    padding: 15px;
    max-height: 800px;
    overflow-y: auto;
}

.bombo-mini { margin-bottom: 20px; }
.bombo-mini h4 { margin: 0 0 10px 0; color: #d4af37; text-align: center; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
.lista-paises { list-style: none; padding: 0; margin: 0; }
.lista-paises li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s; }
.lista-paises li img { width: 18px; }
.sorteado { opacity: 0.2; text-decoration: line-through; filter: grayscale(100%); }

/* DERECHA: GRUPOS ASIGNADOS */
.panel-derecho {
    flex: 3;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 15px;
}

.grupo-box {
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #d4af37;
    border-radius: 10px;
    overflow: hidden;
}
.grupo-header {
    background: #240a16;
    padding: 10px;
    text-align: center;
    font-weight: 900;
    color: #fff;
    border-bottom: 2px solid #d4af37;
}
.grupo-tabla { width: 100%; border-collapse: collapse; }
.grupo-tabla td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: bold; font-size: 14px; min-height: 40px; }
.team-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team-row .team-info { display: flex; align-items: center; gap: 8px; }
.team-row img { width: 20px; border-radius: 2px; }

/* Tag del jugador asignado */
.player-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 900;
    min-width: 75px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    transition: background-color 0.4s, color 0.4s;
}

/* Responsive */
@media (max-width: 900px) {
    .layout-dividido { flex-direction: column; }
    .panel-izquierdo { max-height: 300px; }
    .reveal-area { flex-direction: column; gap: 15px; text-align: center; }
}
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="volver">⬅ Volver al Menú Principal</a>
    <h1>🌎 The World's Game 2026</h1>

    <div class="escenario" id="escenario">
        
        <div id="pantalla-inicio" style="width: 100%;">
            <p style="opacity: 0.8; margin: 0 auto 20px auto; max-width: 600px;">
                Mantiene los <b>Grupos Reales</b> del Mundial. El sistema asignará equitativamente de forma aleatoria exactamente 3 equipos de cada bombo por mánager.
            </p>
            
            <div class="jugadores-setup">
                <label class="jugador-row">
                    <input type="checkbox" class="j-check" value="Joaquín" data-color="#e63946" checked>
                    <div class="color-box" style="background: #e63946;"></div>
                    <span>Joaquín</span>
                </label>
                <label class="jugador-row">
                    <input type="checkbox" class="j-check" value="Mateo" data-color="#4cc9f0" checked>
                    <div class="color-box" style="background: #4cc9f0;"></div>
                    <span>Mateo</span>
                </label>
                <label class="jugador-row">
                    <input type="checkbox" class="j-check" value="Nahuel" data-color="#f77f00" checked>
                    <div class="color-box" style="background: #f77f00;"></div>
                    <span>Nahuel</span>
                </label>
                <label class="jugador-row">
                    <input type="checkbox" class="j-check" value="Nico" data-color="#06d6a0" checked>
                    <div class="color-box" style="background: #06d6a0;"></div>
                    <span>Nico</span>
                </label>
            </div>

            <button class="btn-accion" onclick="comenzarEvento()">Iniciar Sorteo</button>
        </div>

        <div id="pantalla-sorteo" style="display: none; width: 100%;">
            <div class="reveal-area">
                <div class="team-reveal" id="team-reveal" style="display:none;">
                    <img id="reveal-flag" src="">
                    <span id="reveal-name">País</span>
                    <div class="grupo-info" id="reveal-grupo-info">GRUPO X</div>
                </div>
                <div class="player-reveal" id="player-reveal" style="display:none;">
                    <span style="font-size: 16px; font-weight: normal; margin-bottom: 5px; color: #aaa;">Mánager Asignado:</span>
                    <span id="reveal-player">Jugador</span>
                </div>
            </div>
            <button class="btn-accion" id="btn-paso" onclick="avanzarPaso()">Sacar Selección</button>
        </div>
    </div>

    <div class="layout-dividido" id="layout-abajo" style="display: none;">
        <div class="panel-izquierdo" id="contenedor-bombos"></div>
        <div class="panel-derecho" id="contenedor-grupos"></div>
    </div>
</div>

<script>
// MATRIZ DE GRUPOS REALES ACTUALIZADA CON SUS INTEGRANTES FIJOS
const officialGroups = [
    { id: 'A', teams: [ {name: 'México', flag: 'mx', bombo: 1}, {name: 'Corea del Sur', flag: 'kr', bombo: 2}, {name: 'Sudáfrica', flag: 'za', bombo: 3}, {name: 'República Checa', flag: 'cz', bombo: 4} ] },
    { id: 'B', teams: [ {name: 'Canadá', flag: 'ca', bombo: 1}, {name: 'Suiza', flag: 'ch', bombo: 2}, {name: 'Catar', flag: 'qa', bombo: 3}, {name: 'Bosnia y Herzegovina', flag: 'ba', bombo: 4} ] },
    { id: 'C', teams: [ {name: 'Brasil', flag: 'br', bombo: 1}, {name: 'Marruecos', flag: 'ma', bombo: 2}, {name: 'Escocia', flag: 'gb-sct', bombo: 3}, {name: 'Haití', flag: 'ht', bombo: 4} ] },
    { id: 'D', teams: [ {name: 'Estados Unidos', flag: 'us', bombo: 1}, {name: 'Australia', flag: 'au', bombo: 2}, {name: 'Paraguay', flag: 'py', bombo: 3}, {name: 'Turquía', flag: 'tr', bombo: 4} ] },
    { id: 'E', teams: [ {name: 'Alemania', flag: 'de', bombo: 1}, {name: 'Ecuador', flag: 'ec', bombo: 2}, {name: 'Costa de Marfil', flag: 'ci', bombo: 3}, {name: 'Curazao', flag: 'cw', bombo: 4} ] },
    { id: 'F', teams: [ {name: 'Países Bajos', flag: 'nl', bombo: 1}, {name: 'Japón', flag: 'jp', bombo: 2}, {name: 'Túnez', flag: 'tn', bombo: 3}, {name: 'Suecia', flag: 'se', bombo: 4} ] },
    { id: 'G', teams: [ {name: 'Bélgica', flag: 'be', bombo: 1}, {name: 'Irán', flag: 'ir', bombo: 2}, {name: 'Egipto', flag: 'eg', bombo: 3}, {name: 'Nueva Zelanda', flag: 'nz', bombo: 4} ] },
    { id: 'H', teams: [ {name: 'España', flag: 'es', bombo: 1}, {name: 'Uruguay', flag: 'uy', bombo: 2}, {name: 'Arabia Saudita', flag: 'sa', bombo: 3}, {name: 'Cabo Verde', flag: 'cv', bombo: 4} ] },
    { id: 'I', teams: [ {name: 'Francia', flag: 'fr', bombo: 1}, {name: 'Senegal', flag: 'sn', bombo: 2}, {name: 'Noruega', flag: 'no', bombo: 3}, {name: 'Irak', flag: 'iq', bombo: 4} ] },
    { id: 'J', teams: [ {name: 'Argentina', flag: 'ar', bombo: 1}, {name: 'Austria', flag: 'at', bombo: 2}, {name: 'Argelia', flag: 'dz', bombo: 3}, {name: 'Jordania', flag: 'jo', bombo: 4} ] },
    { id: 'K', teams: [ {name: 'Portugal', flag: 'pt', bombo: 1}, {name: 'Colombia', flag: 'co', bombo: 2}, {name: 'Uzbekistán', flag: 'uz', bombo: 3}, {name: 'RD del Congo', flag: 'cd', bombo: 4} ] },
    { id: 'L', teams: [ {name: 'Inglaterra', flag: 'gb-eng', bombo: 1}, {name: 'Croacia', flag: 'hr', bombo: 2}, {name: 'Panamá', flag: 'pa', bombo: 3}, {name: 'Ghana', flag: 'gh', bombo: 4} ] }
];

let jugadoresActivos = [];
let secuenciaSorteo = []; 
let pasoActual = 0;
let estadoFase = 'ESPERANDO';

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function renderEstructuraUI() {
    // 1. Renderizar panel izquierdo por Bombos
    let htmlIzq = '';
    for (let b = 1; b <= 4; b++) { 
        htmlIzq += `<div class="bombo-mini"><h4>BOMBO ${b}</h4><ul class="lista-paises">`;
        officialGroups.forEach(g => {
            let team = g.teams.find(t => t.bombo === b);
            if(team) {
                let safeId = team.name.replace(/[\s\.\(\)]+/g, '-');
                htmlIzq += `<li id="left-${safeId}"><img src="https://flagcdn.com/w40/${team.flag}.png">${team.name}</li>`;
            }
        });
        htmlIzq += `</ul></div>`;
    }
    document.getElementById("contenedor-bombos").innerHTML = htmlIzq;

    // 2. Renderizar panel derecho con los Grupos Reales vacíos esperándose rellenar
    let htmlDer = '';
    officialGroups.forEach(g => {
        htmlDer += `
        <div class="grupo-box">
            <div class="grupo-header">GRUPO ${g.id}</div>
            <table class="grupo-tabla">
                <tbody id="table-group-${g.id}">`;
                
        // Colocamos los equipos ordenados por su bombo (del 1 al 4) para un diseño limpio
        let teamsOrdenados = [...g.teams].sort((a, b) => a.bombo - b.bombo);
        teamsOrdenados.forEach(t => {
            let safeId = t.name.replace(/[\s\.\(\)]+/g, '-');
            htmlDer += `
                <tr>
                    <td>
                        <div class="team-row">
                            <div class="team-info">
                                <img src="https://flagcdn.com/w40/${t.flag}.png"> 
                                <span>${t.name}</span>
                            </div>
                            <div class="player-tag" id="tag-${safeId}" style="background-color: rgba(255,255,255,0.05); color: #666;">
                                POR REVELAR
                            </div>
                        </div>
                    </td>
                </tr>`;
        });
        
        htmlDer += `
                </tbody>
            </table>
        </div>`;
    });
    document.getElementById("contenedor-grupos").innerHTML = htmlDer;
}

// LOGICA BALANCIADA EXACTA: 3 Equipos por bombo sin repetir mánager en el mismo grupo
function generarSecuenciaSorteo() {
    let preAsignaciones = [];
    let numPlayers = jugadoresActivos.length;
    let ordenBombos = [4, 3, 2, 1]; // Sorteo del bombo 4 al bombo 1
    
    let asignacionFinal = {};
    officialGroups.forEach(g => { asignacionFinal[g.id] = {}; });
    
    // Si juegan exactamente 4 mánagers, usamos un cuadrado latino perfecto precargado
    // Esto asegura matemáticamente 3 selecciones de cada bombo por cabeza sin fallas
    if (numPlayers === 4) {
        let baseMatrix = [
            [0, 1, 2, 3], [1, 2, 3, 0], [2, 3, 0, 1], [3, 0, 1, 2],
            [0, 2, 3, 1], [1, 3, 0, 2], [2, 0, 1, 3], [3, 1, 2, 0],
            [0, 3, 1, 2], [1, 0, 2, 3], [2, 1, 3, 0], [3, 2, 0, 1]
        ];
        baseMatrix = shuffle(baseMatrix); // Aleatoriedad de distribución por grupos
        let jugadoresMezclados = shuffle([...jugadoresActivos]); // Aleatoriedad de roles numéricos
        
        officialGroups.forEach((g, idx) => {
            let fila = baseMatrix[idx];
            // Índices de columnas mapeados a Bombos: col 0->B4, col 1->B3, col 2->B2, col 3->B1
            asignacionFinal[g.id][4] = jugadoresMezclados[fila[0]];
            asignacionFinal[g.id][3] = jugadoresMezclados[fila[1]];
            asignacionFinal[g.id][2] = jugadoresMezclados[fila[2]];
            asignacionFinal[g.id][1] = jugadoresMezclados[fila[3]];
        });
    } else {
        // Fallback dinámico adaptativo equitativo en caso de cambiar a 2 o 3 mánagers activos
        ordenBombos.forEach(bombo => {
            let pool = [];
            for (let i = 0; i < 12; i++) {
                pool.push(jugadoresActivos[i % numPlayers]);
            }
            pool = shuffle(pool);
            
            officialGroups.forEach(g => {
                let idx = pool.findIndex(p => !Object.values(asignacionFinal[g.id]).some(x => x.name === p.name));
                if (idx === -1) idx = 0;
                asignacionFinal[g.id][bombo] = pool.splice(idx, 1)[0];
            });
        });
    }
    
    // Armamos la lista secuencial de salida oficial (bombo por bombo estricto)
    for (let bombo of ordenBombos) {
        let listaEquiposBombo = [];
        officialGroups.forEach(g => {
            let team = g.teams.find(t => t.bombo === bombo);
            listaEquiposBombo.push({
                group: g.id,
                team: team,
                player: asignacionFinal[g.id][bombo]
            });
        });
        // Mezclamos el orden en el que saldrán las 12 balotas de este bombo en pantalla
        preAsignaciones.push(...shuffle(listaEquiposBombo));
    }
    
    return preAsignaciones;
}

function comenzarEvento() {
    jugadoresActivos = [];
    
    document.querySelectorAll('.j-check').forEach(chk => {
        if(chk.checked) {
            jugadoresActivos.push({ name: chk.value, color: chk.getAttribute('data-color') });
        }
    });

    if(jugadoresActivos.length < 2) {
        alert("¡Debes marcar al menos 2 mánagers para el sorteo!");
        return;
    }

    renderEstructuraUI();
    secuenciaSorteo = generarSecuenciaSorteo();
    
    document.getElementById('pantalla-inicio').style.display = 'none';
    document.getElementById('pantalla-sorteo').style.display = 'block';
    document.getElementById('layout-abajo').style.display = 'flex';
}

function avanzarPaso() {
    if (pasoActual >= secuenciaSorteo.length) return;
    let dataActual = secuenciaSorteo[pasoActual];
    let btn = document.getElementById('btn-paso');

    if (estadoFase === 'ESPERANDO') {
        document.getElementById('team-reveal').style.display = 'flex';
        document.getElementById('player-reveal').style.display = 'none';
        
        document.getElementById('reveal-flag').src = `https://flagcdn.com/w80/${dataActual.team.flag}.png`;
        document.getElementById('reveal-name').innerText = dataActual.team.name;
        document.getElementById('reveal-grupo-info').innerHTML = `BOMBO ${dataActual.team.bombo} &nbsp;|&nbsp; GRUPO ${dataActual.group}`;
        
        btn.innerText = '¿A quién le toca?';
        estadoFase = 'EQUIPO_REVELADO';

    } else if (estadoFase === 'EQUIPO_REVELADO') {
        document.getElementById('player-reveal').style.display = 'flex';
        
        let pName = document.getElementById('reveal-player');
        pName.innerText = dataActual.player.name;
        pName.style.color = dataActual.player.color;
        
        btn.innerText = 'Siguiente Equipo';
        estadoFase = 'JUGADOR_REVELADO';

    } else if (estadoFase === 'JUGADOR_REVELADO') {
        ubicarEnTablas(dataActual);
        pasoActual++;

        document.getElementById('team-reveal').style.display = 'none';
        document.getElementById('player-reveal').style.display = 'none';

        if (pasoActual < secuenciaSorteo.length) {
            btn.innerText = 'Sacar Selección';
            estadoFase = 'ESPERANDO';
        } else {
            document.getElementById('pantalla-sorteo').innerHTML = `
                <h2 style="font-size: 40px; color:#d4af37; text-transform:uppercase; margin:0;">🏆 ¡Equipos Asignados! 🏆</h2>
                <p>La distribución ha concluido exitosamente respetando los grupos.</p>
            `;
        }
    }
}

function ubicarEnTablas(data) {
    let safeId = data.team.name.replace(/[\s\.]+/g, '-');
    
    // Tachamos del panel izquierdo (bombos)
    let liElement = document.getElementById(`left-${safeId}`);
    if(liElement) liElement.classList.add('sorteado');

    // Iluminamos el mánager en su grupo oficial correspondiente de la derecha
    let tagElement = document.getElementById(`tag-${safeId}`);
    if(tagElement) {
        tagElement.innerText = data.player.name;
        tagElement.style.backgroundColor = data.player.color;
        tagElement.style.color = "#000";
    }
}
</script>
</body>
</html>
